[project]
name = "arc"
version = "0.1.0"
description = "Adaptive Representation Control for few-shot forensic evidence recognition"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "scipy",
    "scikit-learn",
    "pandas",
    "ripser",
    "persim",
    "hydra-core",
    "omegaconf",
    "tqdm",
    "rich",
    "tensorboard",
    "pyyaml",
    "pillow",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
